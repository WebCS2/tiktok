<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baldi's Basics</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      height: 100vh;

      background-image: url("https://static.miraheze.org/baldisbasicswiki/thumb/9/96/Wall.png/240px-Wall.png");
      background-repeat: repeat;
      background-size: 240px;
    }

    /* Go Back button */
    .back-button {
      position: absolute;
      top: 15px;
      left: 15px;

      padding: 10px 18px;

      background: rgba(0,0,0,0.7);
      color: white;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      font-family: "Comic Sans MS", cursive, sans-serif;

      cursor: pointer;

      transition: 0.2s;
    }

    .back-button:hover {
      transform: scale(1.05);
      background: rgba(0,0,0,0.9);
    }

    h1 {
      color: white;
      margin-bottom: 15px;

      font-family: "Comic Sans MS", cursive, sans-serif;
      font-size: 42px;

      text-shadow: 2px 2px 4px black;
    }

    .frame-wrapper {
      position: relative;
      width: 800px;
      max-width: 95%;
    }

    iframe {
      width: 100%;
      height: 450px;

      border: none;
      outline: none;

      border-radius: 12px;

      display: block;
      background: black;
    }

    .fullscreen-icon {
      position: absolute;

      bottom: 15px;
      right: 15px;

      width: 50px;
      height: 50px;

      z-index: 9999;

      cursor: pointer;

      background-image: url("https://cdn-icons-png.flaticon.com/512/8373/8373616.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      filter: brightness(0) invert(1);

      transition: 0.2s;
    }

    .fullscreen-icon:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <button class="back-button" onclick="goBack()">
    Go Back
  </button>

  <h1>Baldi's Basics</h1>

  <div class="frame-wrapper">

    <iframe
      id="gameFrame"
      src="https://www.gameslol.net/data/baldis-basics/index.html"
      allowfullscreen>
    </iframe>

    <div 
      class="fullscreen-icon"
      onclick="openFullscreen()">
    </div>

  </div>

  <script>
    function openFullscreen() {
      const iframe = document.getElementById("gameFrame");

      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } 
      else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } 
      else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }

    function goBack() {
      window.location.href = "https://baldigames.vercel.app/baldi";
    }
  </script>

</body>
</html>
