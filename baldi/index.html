<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baldi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: "Comic Sans MS", cursive;

      background-image: url("https://static.miraheze.org/baldisbasicswiki/thumb/9/96/Wall.png/240px-Wall.png");
      background-repeat: repeat;
      background-size: 240px 240px;
    }

    /* TOP LEFT FRAME */
    .frame {
      position: absolute;
      top: 20px;
      left: 20px;

      width: 260px;
      padding: 15px;

      background: rgba(255, 255, 255, 0.9);
      border: 3px solid black;
      border-radius: 12px;

      display: flex;
      flex-direction: column;
      gap: 10px;

      text-align: center;
    }

    .frame img {
      width: 100%;
      border-radius: 8px;
    }

    .desc {
      font-size: 1rem;
      font-weight: bold;
    }

    button {
      padding: 10px;
      font-size: 1rem;
      border: 2px solid black;
      background: white;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }

    button:hover {
      background: black;
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="frame">
    <img src="https://tse1.mm.bing.net/th/id/OIP.U_yA-Y2GuFs8H0VoXnOwkQAAAA?rs=1&pid=ImgDetMain&o=7&rm=3" />

    <div class="desc">Baldi Basics Original</div>

    <button onclick="window.location.href='/baldi/baldi-basics'">
      Play
    </button>
  </div>

</body>
</html>
