<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: "Comic Sans MS", cursive;
    }

    .frame {
      width: 420px;
      height: 420px;

      background-image: url("https://tse1.mm.bing.net/th/id/OIP.U_yA-Y2GuFs8H0VoXnOwkQAAAA?rs=1&pid=ImgDetMain&o=7&rm=3");
      background-size: cover;
      background-position: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: black;
      padding: 40px;
    }

    .title {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 22px;
      font-size: 1rem;
      border: 2px solid black;
      background: white;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }

    button:hover {
      background: black;
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="frame">
    <div class="title">Classic Baldi Game</div>

    <button onclick="window.location.href='/game/classicbaldi'">
      Play
    </button>
  </div>

</body>
</html>
