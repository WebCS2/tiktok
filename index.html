<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Baldi Games</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      overflow:hidden;

      font-family: "Comic Sans MS", "Comic Sans", cursive;

      /* custom cursor */
      cursor: url("https://th.bing.com/th/id/R.6506b01d700f4f25aa20113de3604318?rik=4EIfxcJq%2b3HgmA&pid=ImgRaw&r=0") 16 16, auto;

      background-image:
        linear-gradient(rgba(255,255,255,0.45), rgba(255,255,255,0.45)),
        url("https://static.miraheze.org/baldisbasicswiki/thumb/9/96/Wall.png/240px-Wall.png");

      background-repeat: repeat;
      background-size: 240px 240px;
    }

    .content{
      color:black;
    }

    h1{
      font-size:2.5rem;
      margin-bottom:10px;
    }

    p{
      font-size:1.1rem;
      margin-bottom:20px;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }

    button{
      font-family: "Comic Sans MS", "Comic Sans", cursive;
      font-size:1rem;

      padding:12px 24px;

      border:2px solid black;
      border-radius:10px;

      background:white;
      color:black;

      cursor:pointer;

      transition:0.2s;
    }

    button:hover{
      background:black;
      color:white;
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Welcome to Baldi Games</h1>
    <p>Play Baldi games here</p>

    <div class="buttons">
      <button onclick="window.location.href='/baldi'">
        Play Baldi Games
      </button>

      <button>
        Put your own game
      </button>
    </div>
  </div>

</body>
</html>
