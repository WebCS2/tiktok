<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Baldi Games</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      overflow:hidden;

      font-family: "Comic Sans MS", cursive;

      /* hide default cursor */
      cursor: none;

      background-image:
        linear-gradient(rgba(255,255,255,0.45), rgba(255,255,255,0.45)),
        url("https://static.miraheze.org/baldisbasicswiki/thumb/9/96/Wall.png/240px-Wall.png");

      background-repeat: repeat;
      background-size: 240px 240px;
    }

    .content{
      color:black;
    }

    h1{
      font-size:2.5rem;
      margin-bottom:10px;
    }

    p{
      font-size:1.1rem;
      margin-bottom:20px;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }

    button{
      font-family: "Comic Sans MS", cursive;
      font-size:1rem;

      padding:12px 24px;
      border:2px solid black;
      border-radius:10px;

      background:white;
      color:black;

      cursor:none;
      transition:0.2s;
    }

    button:hover{
      background:black;
      color:white;
      transform:scale(1.05);
    }

    /* CUSTOM CURSOR */
    #customCursor {
      position: fixed;
      width: 45px;
      height: 45px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Welcome to Baldi Games</h1>
    <p>Play Baldi games here</p>

    <div class="buttons">
      <button onclick="window.location.href='/baldi'">
        Play Baldi Games
      </button>

      <button>
        Put your own game
      </button>
    </div>
  </div>

  <!-- custom cursor image -->
  <img
    id="customCursor"
    src="https://www.pngkey.com/png/full/21-216857_baldi-hand-cursor-baldis-basics-1st-prize.png"
  />

  <script>
    const cursor = document.getElementById("customCursor");

    document.addEventListener("mousemove", (e) => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
    });
  </script>

</body>
</html>
